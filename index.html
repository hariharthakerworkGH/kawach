<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawach</title>
<meta property="og:title" content="Kawach: a shield for your money">
<meta property="og:description" content="See what you can safely spend this month. Free, and your data stays on your phone.">
<meta property="og:image" content="https://getkawach.com/icons/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/kawach.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kawach">
<link rel="preload" href="./fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="app-header">
  <h1 id="view-title">Summary</h1>
  <button type="button" id="space-chip" class="space-chip" hidden></button>
  <span id="sync-indicator" class="sync-indicator" hidden></span>
  <button type="button" id="settings-btn" class="header-btn" aria-label="Backup and settings"><span data-icon="settings"></span></button>
</header>
<div id="update-banner" class="update-banner" hidden>
  <span id="update-banner-text"></span>
  <button type="button" id="update-banner-btn">Reload</button>
</div>
<main id="view-container" class="view-container"></main>
<nav class="bottom-nav">
  <button type="button" class="nav-btn active" data-view="summary">
    <span class="nav-icon" data-icon="summary"></span><span>Summary</span>
  </button>
  <button type="button" class="nav-btn" data-view="add">
    <span class="nav-icon" data-icon="add"></span><span>Add</span>
  </button>
  <button type="button" class="nav-btn" data-view="accounts">
    <span class="nav-icon" data-icon="accounts"></span><span>Accounts</span>
  </button>
  <button type="button" class="nav-btn" data-view="plan">
    <span class="nav-icon" data-icon="plan"></span><span>Plan</span>
  </button>
  <button type="button" class="nav-btn" data-view="transactions">
    <span class="nav-icon" data-icon="history"></span><span>History</span>
  </button>
  <button type="button" class="nav-btn" data-view="coach">
    <span class="nav-icon" data-icon="coach"></span><span>Coach</span>
  </button>
</nav>
<script type="module" src="./js/app.js"></script>
</body>
</html>
