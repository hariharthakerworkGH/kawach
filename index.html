<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <!-- What the browser is allowed to do.
     Kawach's promise is that money data never leaves the phone, and this is
     what makes the browser enforce it rather than trusting the code to be
     careful: connect-src names the only four places anything may be sent,
     so even injected script could not post a statement anywhere else.
     form-action 'none' stops a planted form doing the same, and object-src
     kills plugins outright. There is no frame-ancestors: that one only works
     as an HTTP header, which GitHub Pages will not let us set, so a <meta>
     policy carrying it is ignored and warns. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    worker-src 'self' blob:;
    connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://www.googleapis.com;
    form-action 'none';
    base-uri 'self';
    object-src 'none';
  ">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawach</title>
<meta property="og:title" content="Kawach: a shield for your money">
<meta property="og:description" content="See what you can safely spend this month. Free, and your data stays on your phone.">
<meta property="og:image" content="https://getkawach.com/icons/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<script>
  // Not to be framed. frame-ancestors would say this properly, but it only
  // works as an HTTP response header and GitHub Pages will not let us set
  // one. This is the fallback: if Kawach finds itself inside someone else's
  // page, it breaks out to the top rather than letting a hidden frame sit
  // under their buttons and collect taps meant for something else.
  try {
    if (window.top !== window.self) window.top.location = window.self.location.href;
  } catch (e) {
    // Cross-origin parents will not even let us read window.top.location.
    // Being blocked here IS the framing attempt, so hide the page instead.
    document.documentElement.style.display = 'none';
  }

  // The chosen light or dark, put on <html> before the stylesheet paints, so
  // the app never opens in the wrong colour and corrects itself a moment
  // later. js/appearance.js is the same decision, made again once it loads.
  try {
    var a = JSON.parse(localStorage.getItem('kawach-appearance')) || {};
    var r = document.documentElement;
    // The colouring (js/looks.js): 'auto' is the style's own colouring when
    // it is as light or dark as the phone, else Charts on a dark phone and
    // burning flame light on a light one. READY and LIGHT must match
    // js/looks.js.
    var READY = { tactile: 1, peaks: 1, mindora: 1, instrument: 1 };
    var LIGHT = { 'flame-light': 1, mindora: 1 };
    // Instrument unless another style was chosen (the default since 5.27; Tactile was before).
    var st = a.style === 'charts' ? 'charts' : READY[a.style] ? a.style : 'instrument';
    if (st !== 'charts') r.setAttribute('data-style', st);
    var c = a.colour || ({ light: 'flame-light', dark: 'charts' })[a.theme] || 'auto';
    var pl = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    if (c === 'auto') c = Boolean(LIGHT[st]) === pl ? st : pl ? 'flame-light' : 'charts';
    r.setAttribute('data-colour', c);
    r.setAttribute('data-theme', LIGHT[c] ? 'light' : 'dark');
    if (a.text === 'large' || a.text === 'largest') r.setAttribute('data-text', a.text);
    if (a.density === 'compact') r.setAttribute('data-density', 'compact');
  } catch (e) {}

  // The opening, carried on rather than started again. When a new version
  // took over during the opening, the page reloads behind it; this page then
  // opens on the opening's resting frame, so it reads as one opening, not two.
  try {
    if (sessionStorage.getItem('kawach-boot-resume')) {
      sessionStorage.removeItem('kawach-boot-resume');
      document.documentElement.classList.add('boot-resumed');
    }
  } catch (e) {}

  // (4.17.1 moved the opening's mark up by half the status bar here, on the
  // theory that the page starts below it. The owner's screenshot of the
  // hand-over proved otherwise: the mark sat 29px above Android's icon - the
  // nudge itself, capped at 30 - and without it lines up. Removed in 4.17.2.)
</script>

<link rel="icon" href="./icons/kawach.svg" type="image/svg+xml">
<link rel="icon" href="./icons/kawach-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/kawach-touch-icon.png">

     the migration is under way the rest of the app is untouched by it. -->
<link rel="stylesheet" href="./css/dna.css">
<link rel="stylesheet" href="./css/looks.css">
<link rel="stylesheet" href="./css/style-tactile.css">

<style>
  /* The opening (4.17.1). Inline so it is on screen in the first frame.

     One element from the first frame to the last. An installed app on Android
     opens on Android's own launch screen first - the app icon on the
     manifest's background colour - and only then the page. 4.17 opened on
     black and drew the mark from nothing, so the icon vanished and a second,
     different logo was drawn: two things, one after the other. Now the
     page's first frame IS that launch screen - the same colour (#07090f, the
     manifest's background_color), the same glass shield, the same size, in
     the same place - and it changes from there instead of starting over:
       - a line of light traces the shield's edge, down both sides at once;
       - the glass body dissolves behind it, leaving the shield as a line;
       - the rupee stays exactly where it is the whole time;
       - a glow comes up, the name tracks in below, it rests, and it fades.

     The old exit cut out instead of fading (the same animation re-timed by
     the script; see 4.17). The exit is a transition that switches the
     failsafe off, so nothing can re-time it.

     Everything that moves is transform or opacity on its own layer, which
     keeps its frames while the app starts underneath - except the traced
     edge (stroke-dashoffset), kept to one plain stroke with no gradient or
     filter so its repaint is as small as a repaint can be. The glass icon and
     the glow are each blurred or filtered ONCE and then only fade.

     Easing - cubic-bezier(x1, y1, x2, y2) is a curve from (0,0) to (1,1),
     time across and progress up; the control points set how it leaves and
     how it arrives:
       --ease-draw (0.65, 0, 0.35, 1): at rest at both ends, fastest in the
         middle - a pen that lifts off and sets down, never a jolt.
       --ease-out  (0.22, 1, 0.36, 1): nearly all its speed at once, then a
         long slowing - things arrive and settle instead of stopping dead.
       --ease-exit (0.4, 0, 0.2, 1): a gentle start and a long soft finish,
         so a fade never snaps at either end.

     Timeline: the icon, from frame 0; the edge traces 200-1100ms; the glass
     dissolves 450-1350ms; the glow comes up 700-1600ms; the name tracks in
     from about 850ms; a rest; the fade from 2.5s (held while a new version
     downloads, up to 10s - see the script at the end of this file). */
  .boot {
    --boot-ink: #47d0f8;   /* the app's cyan, its highlight on a dark screen */
    --boot-mark: #e8fbff;  /* the rupee, as on the icon */
    --ease-draw: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-exit: cubic-bezier(0.4, 0, 0.2, 1);
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    /* manifest.webmanifest background_color: the colour Android's launch
       screen is drawn in, so there is no change of colour at the hand-over. */
    background: #07090f;
    /* The failsafe: if no script runs at all, the opening still clears
       itself. Later than the script's own limit for a download (10s), plus
       the moment it may wait for the reload onto it. */
    animation: boot-failsafe 450ms var(--ease-exit) 12000ms forwards;
  }
  @keyframes boot-failsafe { to { opacity: 0; visibility: hidden; } }

  /* The exit: a transition, so nothing can re-time it. Taps reach the app
     from the first moment of the fade. */
  .boot.is-leaving {
    animation: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 450ms var(--ease-exit);
  }

  /* The mark is the only thing in the middle - the name hangs below it - so
     it sits dead centre, which is where Android puts the icon. No nudge: on
     the owner's phone the page fills the screen Android's launch screen
     fills, and the two centres meet as they are (4.17.1 nudged it up and
     that was the gap seen at the hand-over). 242px is measured from the same
     screenshot: Android's shield and this one at the same width (it is drawn
     in dp, which is CSS px on a phone). */
  .boot-art {
    position: relative;
    width: min(242px, 64vw); aspect-ratio: 1;
  }
  .boot-art svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* 1. The icon as Android shows it: glass body, lit edge, rupee. Here from
        the first frame, then dissolving. */
  .boot-icon { animation: boot-fade-out 900ms var(--ease-exit) 450ms forwards; will-change: opacity; }
  @keyframes boot-fade-out { to { opacity: 0; } }

  /* 2. The glow: the finished line mark, blurred once, faded in. */
  .boot-glow { filter: blur(9px); opacity: 0; animation: boot-glow 900ms var(--ease-out) 700ms forwards; will-change: opacity; }
  @keyframes boot-glow { to { opacity: 0.8; } }

  /* 3. The line mark. The edge is traced: pathLength="1" makes each path one
        unit long, so a dash of 1 with a gap of 2 covers it exactly and an
        offset just past 1 hides it. 1.01 and the wide gap, not 1, because
        with round caps a dash ending exactly at a path's start is drawn as a
        dot. The rupee is not traced - it is already on the icon, so it simply
        stays, in the same place and weight, from the first frame to the last. */
  .boot-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .boot-edge {
    stroke: var(--boot-ink); stroke-width: 2.4;
    stroke-dasharray: 1 2; stroke-dashoffset: 1.01;
    animation: boot-trace 900ms var(--ease-draw) 200ms both;
  }
  @keyframes boot-trace {
    0% { stroke-dashoffset: 1.01; opacity: 0; }
    1% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  .boot-sym { stroke: var(--boot-mark); stroke-width: 6.6; }

  /* The name, below the mark without moving it. The tracking opens by moving
     the letters, not by changing letter-spacing: each starts pulled toward
     the middle by its distance from it (--d) and slides out to its place, all
     together on one curve, so the gaps stay equal at every moment - which is
     what makes it read as tracking. It is a transform, so nothing is laid out
     again. The script starts it once Geist has loaded, so the letters never
     arrive in a stand-in font and jump. */
  .boot-word {
    position: absolute; left: -40%; right: -40%; top: calc(100% + 18px);
    display: flex; justify-content: center; gap: 0.34em; margin: 0;
    font: 600 clamp(20px, 6.4vw, 26px)/1 "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
    text-transform: uppercase;
    color: #e6f6fb;
  }
  .boot-word span { opacity: 0; }
  .boot.is-type .boot-word span { animation: boot-letter 760ms var(--ease-out) forwards; }
  @keyframes boot-letter {
    from { opacity: 0; transform: translateX(calc(var(--d) * -0.42em)); }
    to { opacity: 1; transform: none; }
  }

  /* Said only if a new version is still downloading when the opening would
     have left, so a longer opening never looks like a frozen one. */
  .boot-note {
    position: absolute; left: -40%; right: -40%; top: calc(100% + 66px);
    margin: 0; text-align: center;
    font: 500 13px/1.3 "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
    color: rgba(214, 246, 255, 0.62);
    opacity: 0; transition: opacity 400ms var(--ease-out);
  }
  .boot.is-updating .boot-note { opacity: 1; }

  /* After a reload for a new version: straight to the resting frame, which is
     what was on screen a moment before, then the fade. Each rule names .boot
     so it outranks the ones that start the motion, whatever classes are on. */
  .boot-resumed .boot .boot-icon { animation: none; opacity: 0; }
  .boot-resumed .boot .boot-edge { animation: none; stroke-dashoffset: 0; }
  .boot-resumed .boot .boot-glow { animation: none; opacity: 0.8; }
  .boot-resumed .boot .boot-word span { animation: none; opacity: 1; transform: none; }

  /* Motion the person has asked not to see: no tracing and no sliding. The
     icon still gives way to the line mark, but as a fade, which is not
     motion; the opening still leaves on time. */
  @media (prefers-reduced-motion: reduce) {
    .boot-edge { animation: none; stroke-dashoffset: 0; }
    .boot.is-type .boot-word span { animation: none; }
    .boot-word span { opacity: 1; }
    .boot.is-leaving { transition-duration: 200ms; }
  }
</style>
</head>
<body>
<!-- The opening. It leaves through the script at the end of this file, and by
     its own failsafe if that never runs. It begins as Kawach's icon - exactly
     what Android's launch screen has just shown - and becomes the line mark,
     so the hand-over from Android to the app is one continuous thing. -->
<div id="boot" class="boot" aria-hidden="true">
  <div class="boot-art">
    <!-- The icon (icons/kawach.svg, without its square plate): glass body,
         lit edge, rupee. -->
    <svg class="boot-icon" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="bkBody" x1="0.1" y1="0" x2="0.7" y2="1">
          <stop offset="0" stop-color="#47d0f8" stop-opacity="0.42"/>
          <stop offset="0.5" stop-color="#2b7fb8" stop-opacity="0.26"/>
          <stop offset="1" stop-color="#7c5cf0" stop-opacity="0.18"/>
        </linearGradient>
        <linearGradient id="bkEdge" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0" stop-color="#cdf5ff" stop-opacity="0.98"/>
          <stop offset="0.4" stop-color="#47d0f8" stop-opacity="0.8"/>
          <stop offset="1" stop-color="#47d0f8" stop-opacity="0.34"/>
        </linearGradient>
        <linearGradient id="bkSheen" x1="0" y1="0" x2="0.2" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
          <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <filter id="bkGlow" x="-45%" y="-45%" width="190%" height="190%">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feComponentTransfer in="b" result="g"><feFuncA type="linear" slope="0.52"/></feComponentTransfer>
          <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <clipPath id="bkClip"><path d="M50 12L80 22V48C80 68 67 82 50 89C33 82 20 68 20 48V22Z"/></clipPath>
      </defs>
      <g filter="url(#bkGlow)">
        <path d="M50 12L80 22V48C80 68 67 82 50 89C33 82 20 68 20 48V22Z" fill="url(#bkBody)"/>
        <g clip-path="url(#bkClip)"><ellipse cx="33" cy="24" rx="33" ry="25" fill="url(#bkSheen)"/></g>
        <path d="M50 12L80 22V48C80 68 67 82 50 89C33 82 20 68 20 48V22Z" fill="none" stroke="url(#bkEdge)" stroke-width="2.9"/>
        <!-- Its rupee, with the icon's soft halo. The line mark's rupee sits
             exactly on top of it, so as this layer dissolves only the halo
             goes, and the glow layer below brings it back. -->
        <path d="M38 34h24M38 45h24M44 34c11 0 11 20 0 20h-5l17 17" fill="none" stroke="#e8fbff" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <!-- The glow: the finished line mark, blurred, behind the sharp one. -->
    <svg class="boot-glow" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 12L80 22V48C80 68 67 82 50 89C33 82 20 68 20 48V22Z" stroke="#47d0f8" stroke-width="3.2"/>
      <path d="M38 34h24M38 45h24M44 34c11 0 11 20 0 20h-5l17 17" stroke="#d6f6ff" stroke-width="7"/>
    </svg>
    <!-- The line mark. The edge is two halves that start together at the top
         and meet at the point. The rupee is the icon's own, in the same place
         and weight, so it never leaves the screen. -->
    <svg class="boot-mark" viewBox="0 0 100 100">
      <path class="boot-line boot-edge" pathLength="1" d="M50 12L20 22V48C20 68 33 82 50 89"/>
      <path class="boot-line boot-edge" pathLength="1" d="M50 12L80 22V48C80 68 67 82 50 89"/>
      <path class="boot-line boot-sym" d="M38 34h24M38 45h24M44 34c11 0 11 20 0 20h-5l17 17"/>
    </svg>
    <p class="boot-word"><span style="--d:-2.5">K</span><span style="--d:-1.5">a</span><span style="--d:-0.5">w</span><span style="--d:0.5">a</span><span style="--d:1.5">c</span><span style="--d:2.5">h</span></p>
    <p class="boot-note">Updating to the latest version</p>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
<script>
  // Always on the latest version, and when the opening leaves.
  //
  // How a new version arrives: sw.js downloads every file of it, takes over
  // straight away (skipWaiting + clients.claim), and js/app.js reloads the page
  // onto it the moment it does - on a screen where that is safe and nothing is
  // being typed. That part already worked. What made updates slow was the
  // asking: the browser only asks the server for a new version when the page
  // is LOADED, and opening Kawach from recent apps usually brings back the
  // page still in memory rather than loading it. So an update could wait days
  // for a real restart. Now it asks every time the app comes back on screen.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var lastAsked = 0;
    function ask() {
      // Once every 30 seconds at most: flicking between apps should not mean
      // a request to the server each time.
      if (Date.now() - lastAsked < 30000) return;
      lastAsked = Date.now();
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) return reg.update();
      }).catch(function () {});
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') ask();
    });
    ask();
  })();

  // When the opening leaves, and taking it out of the page.
  //
  // It fades at 2.5s: the mark has settled by about 1.6s, so it rests for
  // about a second first. It only goes once a screen has drawn underneath,
  // and by 4s whatever happens - unless a new version is downloading, when it
  // stays (up to 10s, with a line saying so) so that the reload onto the new
  // version happens behind it. The page that loads then opens on the resting
  // frame (see the head), so the person sees one opening.
  //
  // performance.now() is time since this page began, the clock the CSS
  // animations above run on. Readiness is checked on a timer, not each frame:
  // frames stop altogether in a tab opened in the background.
  (function () {
    var boot = document.getElementById('boot');
    if (!boot) return;
    var resumed = document.documentElement.classList.contains('boot-resumed');
    var HOLD = resumed ? 400 : 2500;
    var CAP = 4000;
    // A new version is about 95 files, the PDF reader among them, so on a
    // slow connection it can take a while. Long enough for most, not so long
    // that anyone is kept waiting on a bad day; past it, this version opens
    // and the new one is taken the next time.
    var UPDATE_CAP = 10000;
    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var FADE = reduced ? 200 : 450; // matches the transition in the CSS
    var leaving = false;
    var updating = false;
    // The new version has taken over and the reload onto it is on its way.
    // The opening must not start leaving in that moment, or the old app shows
    // for a split second before the reload - a second opening in all but name.
    var handingOver = false;

    // The name: once Geist has loaded (or after 1.1s regardless), and never
    // before 850ms. Not on a resumed page: it is already showing.
    if (!resumed) {
      var typeface = document.fonts && document.fonts.load
        ? document.fonts.load('600 24px "Geist"').catch(function () {})
        : Promise.resolve();
      Promise.race([typeface, new Promise(function (r) { setTimeout(r, 1100); })]).then(function () {
        setTimeout(function () { boot.classList.add('is-type'); }, Math.max(0, 850 - performance.now()));
      });
    }

    // A new version on its way while the opening is up. Only when a version
    // is already running (a first visit has nothing to be newer than), and
    // never on a page that has just reloaded for one.
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller && !resumed) {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (!reg) return;
        function watch(worker) {
          if (!worker) return;
          updating = true;
          worker.addEventListener('statechange', function () {
            // A download that failed: carry on with this version.
            if (worker.state === 'redundant') updating = false;
          });
        }
        watch(reg.installing || reg.waiting);
        reg.addEventListener('updatefound', function () { watch(reg.installing); });
      }).catch(function () {});
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!updating) return;
        // The new version has taken over and app.js reloads onto it now. The
        // next page carries the opening on from its resting frame. If no
        // reload comes (app.js judged it unsafe), let the opening go as
        // normal and take the note back.
        try { sessionStorage.setItem('kawach-boot-resume', '1'); } catch (e) {}
        handingOver = true;
        setTimeout(function () {
          try { sessionStorage.removeItem('kawach-boot-resume'); } catch (e) {}
          handingOver = false;
          updating = false;
        }, 1500);
      });
    }

    function drawn() {
      var main = document.getElementById('view-container');
      return !!(main && main.firstElementChild);
    }

    // Out of the document once it is invisible. transitionend is the signal;
    // the timer covers the cases where that event never comes - a 0ms fade, a
    // tab in the background - since an invisible overlay left in place would
    // still be in the way.
    function unmount() {
      if (boot.parentNode) boot.parentNode.removeChild(boot);
    }
    function leave() {
      if (leaving) return;
      leaving = true;
      clearInterval(timer);
      boot.addEventListener('transitionend', function (e) {
        if (e.target === boot && e.propertyName === 'opacity') unmount();
      });
      setTimeout(unmount, FADE + 250);
      boot.classList.add('is-leaving');
    }

    var timer = setInterval(function () {
      var t = performance.now();
      if (handingOver) return;
      if (updating && t < UPDATE_CAP) {
        if (t >= HOLD) boot.classList.add('is-updating');
        return;
      }
      if ((t >= HOLD && drawn()) || t >= CAP) leave();
    }, 50);
  })();
</script>
</body>
</html>
