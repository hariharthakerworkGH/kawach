<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <!-- What the browser is allowed to do.
     Kawach's promise is that money data never leaves the phone, and this is
     what makes the browser enforce it rather than trusting the code to be
     careful: connect-src names the only four places anything may be sent,
     so even injected script could not post a statement anywhere else.
     form-action 'none' stops a planted form doing the same, and object-src
     kills plugins outright. There is no frame-ancestors: that one only works
     as an HTTP header, which GitHub Pages will not let us set, so a <meta>
     policy carrying it is ignored and warns. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    worker-src 'self' blob:;
    connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://www.googleapis.com;
    form-action 'none';
    base-uri 'self';
    object-src 'none';
  ">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawach</title>
<meta property="og:title" content="Kawach: a shield for your money">
<meta property="og:description" content="See what you can safely spend this month. Free, and your data stays on your phone.">
<meta property="og:image" content="https://getkawach.com/icons/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<script>
  // Not to be framed. frame-ancestors would say this properly, but it only
  // works as an HTTP response header and GitHub Pages will not let us set
  // one. This is the fallback: if Kawach finds itself inside someone else's
  // page, it breaks out to the top rather than letting a hidden frame sit
  // under their buttons and collect taps meant for something else.
  try {
    if (window.top !== window.self) window.top.location = window.self.location.href;
  } catch (e) {
    // Cross-origin parents will not even let us read window.top.location.
    // Being blocked here IS the framing attempt, so hide the page instead.
    document.documentElement.style.display = 'none';
  }

  // The chosen light or dark, put on <html> before the stylesheet paints, so
  // the app never opens in the wrong colour and corrects itself a moment
  // later. js/appearance.js is the same decision, made again once it loads.
  try {
    var a = JSON.parse(localStorage.getItem('kawach-appearance')) || {};
    var r = document.documentElement;
    if (a.theme === 'light' || a.theme === 'dark') r.setAttribute('data-theme', a.theme);
    if (a.text === 'large' || a.text === 'largest') r.setAttribute('data-text', a.text);
    if (a.density === 'compact') r.setAttribute('data-density', 'compact');
  } catch (e) {}
</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/kawach.svg" type="image/svg+xml">
<link rel="icon" href="./icons/kawach-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/kawach-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kawach">
<link rel="preload" href="./fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/style.css">
<!-- The new visual system. Screens opt in by carrying the `k` class; while
     the migration is under way the rest of the app is untouched by it. -->
<link rel="stylesheet" href="./css/dna.css">
<style>
  /* The opening (4.17). Inline so it is on screen in the first frame, before
     any module has loaded - the moment it exists to fill.

     The old one cut out instead of fading. Its failsafe ran `boot-out` with a
     3.6s delay, and the script "faded" it by setting the SAME animation again
     with no delay. A browser re-times the animation it is already running
     rather than starting a new one, so at 2.1s it found a 420ms fade already
     2.1s in - finished - and dropped it to nothing in one frame. Here the
     failsafe and the exit are two different mechanisms (a keyframe animation
     and a transition), and the exit switches the failsafe off.

     What moves, and how:
       - transform and opacity only, for everything that moves while the app
         is starting underneath: the settle, the glow, the letters, the exit.
         Those run on the compositor and keep their frames even when the main
         thread is busy;
       - the one exception is the line drawing itself (stroke-dashoffset),
         which is painted. It is kept as cheap as a paint can be - a plain
         stroke, no gradient and no filter - and the glow that would make it
         expensive is a separate, already-blurred layer that only fades in.

     The easing, in plain terms. cubic-bezier(x1, y1, x2, y2) is a curve from
     (0,0) to (1,1) where x is time and y is how far along the motion is; the
     two control points set how it leaves and how it arrives.
       --ease-draw (0.65, 0, 0.35, 1): y1 = 0 holds it at rest for the first
         stretch, it is fastest in the middle, and y2 = 1 brings it to rest
         again - a pen that lifts off and sets down, never a jolt at either end.
       --ease-out  (0.22, 1, 0.36, 1): y1 = 1 gives it almost all its speed at
         once and spends the rest slowing down - things arrive and settle
         rather than stopping dead. Used for everything that appears.
       --ease-exit (0.4, 0, 0.2, 1): a short, gentle start and a long, soft
         finish, so the fade never snaps at either end.

     Timeline: darkness to 150ms; the shield draws from its top down both
     sides at once, 150-1150ms; the rupee is written 700-1280ms; the glow
     comes up 1000-1900ms; the name spreads into place from about 850ms; then
     it rests, and fades from 2.5s. */
  .boot {
    --boot-ink: #47d0f8;   /* the app's cyan, its highlight on a dark screen */
    --boot-mark: #d6f6ff;  /* the rupee: the same cyan, nearly white */
    --ease-draw: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-exit: cubic-bezier(0.4, 0, 0.2, 1);
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: #000;
    /* The failsafe. If no script runs at all, the opening still clears itself
       at 4.6s, so a broken module can never leave someone staring at a shield.
       The script switches it off when it starts its own fade. */
    animation: boot-failsafe 450ms var(--ease-exit) 4600ms forwards;
  }
  @keyframes boot-failsafe { to { opacity: 0; visibility: hidden; } }

  /* The exit: a transition, not an animation, so nothing can re-time it.
     Taps go through to the app from the first moment of the fade. */
  .boot.is-leaving {
    animation: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 450ms var(--ease-exit);
  }

  /* The whole mark settles in: a little under size and transparent, to rest. */
  .boot-stage {
    display: grid; justify-items: center; gap: 26px;
    animation: boot-settle 1150ms var(--ease-out) 150ms both;
    will-change: transform, opacity;
  }
  @keyframes boot-settle { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }

  /* Kept big: an earlier opening was found too small to register. */
  .boot-art { position: relative; width: min(260px, 64vw); aspect-ratio: 1; }
  .boot-art svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* The glow: the same lines, blurred once, faded in once they are drawn.
     Only its opacity changes, so the blur is worked out a single time. */
  .boot-glow { filter: blur(9px); opacity: 0; animation: boot-glow 900ms var(--ease-out) 1000ms forwards; will-change: opacity; }
  @keyframes boot-glow { to { opacity: 0.8; } }

  /* The lines. pathLength="1" makes every path one unit long, so a dash of 1
     with a gap of 2 covers it exactly, and an offset just past 1 hides it.
     The gap is wider than the path and the offset is 1.01 rather than 1 for a
     reason: with round caps, a dash ending exactly at the start of a path is
     drawn as a dot. The old opening showed three of them before writing the
     rupee. Opacity also holds each line at nothing until its own draw begins. */
  .boot-line {
    stroke: var(--boot-ink); stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1 2; stroke-dashoffset: 1.01;
  }
  .boot-edge { animation: boot-draw 1000ms var(--ease-draw) 150ms both; }
  .boot-sym { stroke: var(--boot-mark); stroke-width: 4.4; animation: boot-draw 420ms var(--ease-out) both; }
  .boot-sym:nth-of-type(3) { animation-delay: 700ms; }
  .boot-sym:nth-of-type(4) { animation-delay: 780ms; }
  .boot-sym:nth-of-type(5) { animation-delay: 860ms; }
  @keyframes boot-draw {
    0% { stroke-dashoffset: 1.01; opacity: 0; }
    1% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }

  /* The name. The tracking widens by moving the letters, not by changing
     letter-spacing: each letter starts pulled toward the middle by its
     distance from it (--d, in letters) and slides out to its place, which
     reads exactly as the spacing opening up - but it is a transform, so
     nothing is laid out again. All six move together, on the same curve:
     because each one's distance is proportional to --d, the gaps between them
     stay equal at every moment, which is what makes it read as tracking.
     (Staggering them was tried and split the word in two mid-way.) */
  .boot-word {
    display: flex; gap: 0.34em; margin: 0;
    font: 600 clamp(20px, 6.4vw, 26px)/1 "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
    text-transform: uppercase;
    color: #e6f6fb;
  }
  .boot-word span { opacity: 0; }
  /* Started by the script once the typeface is in, so the letters never
     arrive in a stand-in font and jump when Geist turns up. */
  .boot.is-type .boot-word span { animation: boot-letter 760ms var(--ease-out) forwards; }
  @keyframes boot-letter {
    from { opacity: 0; transform: translateX(calc(var(--d) * -0.42em)); }
    to { opacity: 1; transform: none; }
  }

  /* Motion the person has asked not to see: everything is simply there, and
     the opening still leaves on time, with a shorter fade. */
  @media (prefers-reduced-motion: reduce) {
    .boot-stage, .boot-glow, .boot-edge, .boot-sym, .boot.is-type .boot-word span { animation: none; }
    .boot-line { stroke-dashoffset: 0; }
    .boot-glow { opacity: 0.8; }
    .boot-word span { opacity: 1; }
    .boot.is-leaving { transition-duration: 200ms; }
  }
</style>
</head>
<body>
<!-- The opening. It leaves through the script at the end of this file, and by
     its own failsafe if that never runs. Kawach's own mark - the shield and the
     rupee of the home-screen icon - drawn as lines, so the opening and the
     installed icon are one thing. -->
<div id="boot" class="boot" aria-hidden="true">
  <div class="boot-stage">
    <div class="boot-art">
      <!-- The glow: the finished mark, blurred, behind the sharp one. -->
      <svg class="boot-glow" viewBox="0 0 100 100" fill="none" stroke="#47d0f8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 12L80 22V48C80 68 67 82 50 89C33 82 20 68 20 48V22Z"/>
        <path d="M38 34h24M38 45h24M44 34c11 0 11 20 0 20h-5l17 17" stroke="#d6f6ff" stroke-width="5"/>
      </svg>
      <!-- The mark. The shield is two halves that start together at the top
           and meet at the point, so it closes symmetrically; then the rupee is
           written in the order a hand writes it. -->
      <svg class="boot-mark" viewBox="0 0 100 100" fill="none">
        <path class="boot-line boot-edge" pathLength="1" d="M50 12L20 22V48C20 68 33 82 50 89"/>
        <path class="boot-line boot-edge" pathLength="1" d="M50 12L80 22V48C80 68 67 82 50 89"/>
        <path class="boot-line boot-sym" pathLength="1" d="M38 34h24"/>
        <path class="boot-line boot-sym" pathLength="1" d="M38 45h24"/>
        <path class="boot-line boot-sym" pathLength="1" d="M44 34c11 0 11 20 0 20h-5l17 17"/>
      </svg>
    </div>
    <p class="boot-word"><span style="--d:-2.5">K</span><span style="--d:-1.5">a</span><span style="--d:-0.5">w</span><span style="--d:0.5">a</span><span style="--d:1.5">c</span><span style="--d:2.5">h</span></p>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
<script>
  // When the opening leaves, and taking it out of the page.
  //
  // It fades at 2.5s - the mark is finished by about 1.5s, so it rests for a
  // full second first, long enough to register. It only goes once a screen has
  // actually drawn underneath, so the fade never uncovers an empty page; and
  // whatever happens it goes by 4s, ahead of the CSS failsafe at 4.6s.
  //
  // performance.now() is time since the page began, which is the clock the
  // CSS animations above run on, so 2,500 here is 2,500 there.
  //
  // Readiness is checked on a timer rather than each animation frame: frames
  // stop altogether in a tab opened in the background, and this must still
  // run there. It asks the document afresh each time, because showView() in
  // js/app.js REPLACES #view-container rather than filling it.
  (function () {
    var boot = document.getElementById('boot');
    if (!boot) return;
    var HOLD = 2500;
    var CAP = 4000;
    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var FADE = reduced ? 200 : 450; // matches the transition in the CSS
    var leaving = false;

    // The name: started once Geist has loaded (or after 1.1s regardless), and
    // never before 850ms, so it comes in as the rupee is finished.
    var typeface = document.fonts && document.fonts.load
      ? document.fonts.load('600 24px "Geist"').catch(function () {})
      : Promise.resolve();
    Promise.race([typeface, new Promise(function (r) { setTimeout(r, 1100); })]).then(function () {
      setTimeout(function () { boot.classList.add('is-type'); }, Math.max(0, 850 - performance.now()));
    });

    function drawn() {
      var main = document.getElementById('view-container');
      return !!(main && main.firstElementChild);
    }

    // Out of the document once it is invisible, so nothing can sit on top of
    // the app or keep a layer alive. transitionend is the signal; the timer is
    // there because that event never comes in some cases - a 0ms fade, a tab
    // in the background, a style the browser decided not to animate - and an
    // invisible overlay left in place would still be in the way.
    function unmount() {
      if (boot.parentNode) boot.parentNode.removeChild(boot);
    }
    function leave() {
      if (leaving) return;
      leaving = true;
      clearInterval(timer);
      boot.addEventListener('transitionend', function (e) {
        if (e.target === boot && e.propertyName === 'opacity') unmount();
      });
      setTimeout(unmount, FADE + 250);
      boot.classList.add('is-leaving');
    }

    var timer = setInterval(function () {
      var t = performance.now();
      if ((t >= HOLD && drawn()) || t >= CAP) leave();
    }, 50);
  })();
</script>
</body>
