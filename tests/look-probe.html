<!doctype html>
<html lang="en" data-style="mindora" data-colour="mindora" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dna.css">
<link rel="stylesheet" href="../css/looks.css">
<link rel="stylesheet" href="../css/style-tactile.css">
<link rel="stylesheet" href="../css/style-peaks.css">
<link rel="stylesheet" href="../css/style-mindora.css">
</head>
<body>
<header class="app-header"><h1 id="view-title">Summary</h1></header>
<main id="view-container" class="view-container k"></main>
<nav class="bottom-nav" id="tabs"><button type="button" class="nav-btn active"><span class="nav-icon"></span>Summary</button><button type="button" class="nav-btn">Add</button></nav>
<script type="module">
  // Made-up figures, to see a style drawn without the app's data.
  const q = new URLSearchParams(location.search);
  if (q.get('style')) document.documentElement.dataset.style = q.get('style');
  if (q.get('colour')) document.documentElement.dataset.colour = q.get('colour');
  if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
  const { hero } = await import('../js/ui.js');
  const { monthWaves } = await import('../js/views/summary.js');
  const amts = [3000, 1200, 400, 5400, 800, 600, 1600, 9700, 500, 2500, 1100, 700, 900, 2300];
  let run = 0;
  const f = { limit: 3100000, daysIntoCycle: 14, daysToClose: 18, spendByDay: amts.map((a, i) => ({ date: `2026-10-${String(i + 1).padStart(2, '0')}`, amount: a * 100 })), spendDays: amts.map((a) => (run += a * 100)) };
  document.getElementById('view-container').innerHTML = hero({
    label: 'Left to spend', period: '1 Oct to 31 Oct', amount: '₹12,450',
    status: 'About ₹700 a day until 31 Oct.',
    tracking: { stats: [{ k: 'Spent', v: '₹18,550' }, { k: 'Budget', v: '₹31,000' }, { k: 'A day', v: '₹700' }],
      rings: [{ value: 0.6, grad: 'spent', label: 'spent' }, { value: 0.45, grad: 'month', label: 'month gone' }, { value: 0.7, grad: 'aside', label: 'set aside used' }] },
  }) + monthWaves(f) + '<div class="totals-card" style="height:300px"></div>';
</script>
</body>
</html>
