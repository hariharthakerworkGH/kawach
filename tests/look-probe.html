<!doctype html>
<html lang="en" data-style="mindora" data-colour="mindora" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dna.css">
<link rel="stylesheet" href="../css/looks.css">
<link rel="stylesheet" href="../css/style-tactile.css">
<link rel="stylesheet" href="../css/style-peaks.css">
<link rel="stylesheet" href="../css/style-mindora.css">
<link rel="stylesheet" href="../css/style-instrument.css">
</head>
<body>
<header class="app-header"><h1 id="view-title">Summary</h1></header>
<main id="view-container" class="view-container k"></main>
<nav class="bottom-nav" id="tabs"><button type="button" class="nav-btn active"><span class="nav-icon"></span>Summary</button><button type="button" class="nav-btn">Add</button></nav>
<script type="module">
  // Made-up figures, to see a style's Summary drawn without the app's data:
  // ?style=&colour=&theme= (style charts draws the Charts top).
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (q.get('style')) q.get('style') === 'charts' ? root.removeAttribute('data-style') : (root.dataset.style = q.get('style'));
  if (q.get('colour')) root.dataset.colour = q.get('colour');
  if (q.get('theme')) root.dataset.theme = q.get('theme');
  const { hero } = await import('../js/ui.js');
  const { monthWaves, monthMountains, weekPills, spendingStatus } = await import('../js/views/summary.js');
  const looks = await import('../js/views/summary-looks.js');
  const amts = [3000, 1200, 400, 5400, 800, 600, 1600, 9700, 500, 2500, 1100, 700, 900, 2300];
  let run = 0;
  const f = {
    limit: 3150000, free: 926800, spentThisCycle: 2223200, used: 0.71, perDay: 51500, level: 'ok',
    daysIntoCycle: 14, daysToClose: 18, cycleStart: '2026-10-01', cycleKey: '2026-10-31', today: '2026-10-14',
    spendByDay: amts.map((a, i) => ({ date: `2026-10-${String(i + 1).padStart(2, '0')}`, amount: a * 100 })),
    spendDays: amts.map((a) => (run += a * 100)),
    cards: [{ account: { label: 'ICICI Amazon Pay', last4: '4321' }, owed: 1245000, unpaid: 987000 }, { account: { label: 'HDFC Millennia' }, owed: 1101700, unpaid: 0 }, { account: { label: 'Swiggy 9012' }, owed: 120000, unpaid: 0 }],
    totals: { owedCards: 2346700, unpaidBills: 987000 }, cardBills: [{ label: 'Card 1 bill', amount: 987000 }],
    reimbursable: { owed: 260400 },
    tracker: [
      { label: 'Groceries', setAside: true, amount: 1200000, used: 400000, left: 800000, status: 'ok' },
      { label: 'Fuel', setAside: true, amount: 800000, used: 150000, left: 650000, status: 'ok' },
      { label: 'Internet', due: '2026-10-18', amount: 109900, left: 109900, status: 'due' },
      { label: 'Phone', due: '2026-10-24', amount: 49900, left: 49900, status: 'due' },
      { label: 'Rent', due: '2026-10-05', amount: 1800000, left: 1800000, status: 'late' },
    ],
  };
  const style = root.dataset.style;
  const tops = { tactile: looks.tactileTop, peaks: looks.peaksTop, mindora: looks.mindoraTop, instrument: looks.instrumentTop };
  // ?finished=1: the month as it reads once it is over (5.22.2).
  if (q.get('finished') === '1') f.finished = true;
  const status = f.finished ? 'Final for October' : spendingStatus(f);
  const month = style === 'peaks' ? monthMountains(f, '<div class="pk-head"><span class="pk-lab">This month</span></div>') : monthWaves(f);
  document.getElementById('view-container').innerHTML = tops[style]
    ? tops[style](f, status, month)
    : hero({ label: 'Left to spend', period: '1 Oct to 31 Oct', amount: '₹9,268', status,
        tracking: { stats: [{ k: 'Spent', v: '₹22,232' }, { k: 'Budget', v: '₹31,500' }, { k: 'A day', v: '₹515' }],
          rings: [{ value: 0.71, grad: 'spent', label: 'spent' }, { value: 0.45, grad: 'month', label: 'month gone' }, { value: 0.27, grad: 'aside', label: 'set aside used' }] } }) + month + weekPills(f) + looks.chartsComing(f);
</script>
</body>
</html>
