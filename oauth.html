<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <!-- What the browser is allowed to do.
     Kawach's promise is that money data never leaves the phone, and this is
     what makes the browser enforce it rather than trusting the code to be
     careful: connect-src names the only four places anything may be sent,
     so even injected script could not post a statement anywhere else.
     form-action 'none' stops a planted form doing the same, and object-src
     kills plugins outright. There is no frame-ancestors: that one only works
     as an HTTP header, which GitHub Pages will not let us set, so a <meta>
     policy carrying it is ignored and warns. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    worker-src 'self' blob:;
    connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://www.googleapis.com;
    form-action 'none';
    base-uri 'self';
    object-src 'none';
  ">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kawach</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090f; color: #a3a8b3;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { color: #47d0f8; }
</style>
</head>
<body>
<!-- Where Google sends the user back after signing in for Drive backups.
     The pass Google gives is in the part of the address after '#', which
     never reaches any server; it is checked, kept for this visit only, wiped
     from the address, and the app carries on with what was asked. -->
<p id="msg">Connecting to Google Drive…</p>
<script type="module">
  import { acceptSignIn } from './js/drive.js';
  const hash = location.hash;
  history.replaceState(null, '', location.pathname);
  try {
    const purpose = acceptSignIn(hash);
    location.replace(`./?drive=${encodeURIComponent(purpose)}#${purpose === 'sync' ? 'summary' : 'settings'}`);
  } catch (err) {
    // A quiet renewal for sync that Google couldn't give without asking:
    // straight back to the app, which says so beside sync.
    if (err.silent) location.replace('./#summary');
    else document.getElementById('msg').innerHTML = `${err.message.replace(/</g, '&lt;')}<br><br><a href="./#settings">Back to Kawach</a>`;
  }
</script>
</body>
</html>
