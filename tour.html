<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <!-- The same promise as every other page: nothing is fetched from, or sent
     to, anywhere but this address. The film is drawn by js/tour-film.js on
     one canvas, with the app's own typeface and icons. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'none';
    form-action 'none';
    base-uri 'self';
    object-src 'none';
  ">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawach tour</title>
<meta name="description" content="Kawach in ninety seconds: what's safe to spend, adding a payment, accounts, the month's plan, history and Coach.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="./icons/kawach.svg" type="image/svg+xml">
<style>
  @font-face {
    font-family: "Geist";
    src: url("./fonts/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: #f2f4f8;
    font-family: Geist, system-ui, sans-serif;
  }
  /* The film fills the space above the controls, letterboxed in black. */
  .tf-frame { position: fixed; inset: 0 0 52px; display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; background: #05070c; }
  .tf-controls {
    position: fixed; left: 0; right: 0; bottom: 0; height: 52px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; background: #000;
  }
  .tf-btn { width: 38px; height: 38px; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); color: #f2f4f8; cursor: pointer; flex: none; }
  .tf-btn svg { width: 17px; height: 17px; }
  .tf-btn:focus-visible, .tf-scrub:focus-visible { outline: 2px solid #47d0f8; outline-offset: 2px; }
  .tf-scrub { flex: 1; min-width: 0; accent-color: #47d0f8; }
  .tf-time { font-size: 13px; color: #aab0bd; font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
  .is-capture .tf-controls { display: none; }
</style>
</head>
<body>
<div class="tf-frame"><canvas id="stage" role="img" aria-label="A ninety-second film of Kawach, with example figures"></canvas></div>
<div class="tf-controls">
  <button type="button" class="tf-btn" id="tf-play" aria-label="Play"></button>
  <input type="range" class="tf-scrub" id="tf-scrub" min="0" max="96000" step="10" value="0" aria-label="Position in the tour">
  <span class="tf-time" id="tf-time">0:00 / 1:36</span>
</div>
<script type="module" src="./js/tour-film.js"></script>
</body>
</html>
