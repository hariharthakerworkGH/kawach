<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <!-- The same promise as every other page: nothing is fetched from, or sent
     to, anywhere but this address. The tour is drawn live from the app's own
     stylesheets and icons, so it needs no video file and works offline. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'none';
    form-action 'none';
    base-uri 'self';
    object-src 'none';
  ">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawach tour</title>
<meta name="description" content="A one-minute tour of Kawach: what's left to spend, card bills, and work costs you get paid back for.">
<meta name="theme-color" content="#07090f">
<link rel="icon" href="./icons/kawach.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/dna.css">
<style>
  /* The page is a cinema: black, nothing scrolls, the film fills it. */
  html, body { height: 100%; }
  body.tf-body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: var(--k-font);
    color: var(--k-text);
  }

  /* The film is drawn on a fixed 400 x 820 stage and scaled to fit, so every
     position in the script means the same thing on a phone and a monitor. */
  .tf-frame { position: fixed; inset: 0 0 56px; overflow: hidden; }
  .tf-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 400px;
    height: 820px;
    flex: none;
    overflow: hidden;
    background: var(--k-bg);
    transform-origin: center center;
  }
  .tf-stage::before {
    content: "";
    position: absolute;
    inset: -10% -20% 40%;
    background:
      radial-gradient(60% 60% at 18% 8%, color-mix(in oklch, var(--k-cyan) 14%, transparent), transparent 70%),
      radial-gradient(50% 55% at 90% 14%, color-mix(in oklch, var(--k-violet) 14%, transparent), transparent 72%);
    pointer-events: none;
  }
  .tf-black { position: absolute; inset: 0; background: #000; pointer-events: none; z-index: 50; }

  /* Words on the stage, outside the phone. */
  .tf-words { position: absolute; left: 24px; right: 24px; text-align: center; z-index: 5; }
  .tf-tenets { top: 250px; display: grid; gap: 14px; }
  .tf-tenet { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .tf-tenet b { font-weight: 700; color: var(--k-accent); }
  .tf-tenet-sub { margin-top: 18px; font-size: 17px; color: var(--k-text-2); }
  .tf-caption {
    top: 34px;
    font-size: 21px;
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.2;
    min-height: 52px;
  }
  .tf-caption span { position: absolute; left: 0; right: 0; top: 0; text-wrap: balance; }
  .tf-outro { top: 300px; }
  .tf-outro-mark { width: 84px; height: 84px; margin: 0 auto 26px; display: block; }
  .tf-outro-line { font-size: 30px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }
  .tf-outro-name { margin-top: 18px; font-size: 44px; font-weight: 800; letter-spacing: 0.18em; color: var(--k-accent); }

  /* The phone. Its screen is a real Kawach screen (.k) at a real width. */
  .tf-phone {
    position: absolute;
    left: 40px;
    top: 112px;
    width: 320px;
    height: 664px;
    border-radius: 44px;
    padding: 10px;
    box-sizing: border-box;
    background: linear-gradient(160deg, oklch(30% 0.02 268), oklch(16% 0.016 268));
    box-shadow: 0 30px 80px -20px oklch(0% 0 0 / 0.8), 0 0 0 1px oklch(40% 0.02 268 / 0.5);
    z-index: 10;
    transform-origin: 50% 40%;
  }
  .tf-screen {
    position: relative;
    width: 300px;
    height: 644px;
    border-radius: 35px;
    overflow: hidden;
    background: var(--k-bg);
  }
  .tf-notch { position: absolute; top: 9px; left: 50%; width: 76px; height: 20px; margin-left: -38px; border-radius: 12px; background: #000; z-index: 30; }
  .tf-head {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 74px;
    padding: 38px 18px 0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    z-index: 20;
  }
  .tf-head-title { position: relative; height: 26px; flex: 1; }
  .tf-head-title span { position: absolute; left: 0; top: 0; }
  .tf-head .icon { width: 20px; height: 20px; color: var(--k-text-2); }
  .tf-view {
    position: absolute;
    top: 74px; left: 0; right: 0; bottom: 66px;
    padding: 6px 14px 0;
    overflow: hidden;
    box-sizing: border-box;
  }
  .tf-nav {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 66px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    padding: 6px 4px 12px;
    box-sizing: border-box;
    background: color-mix(in oklch, var(--k-bg-elev) 92%, transparent);
    border-top: 1px solid var(--k-hairline);
    z-index: 20;
  }
  .tf-nav-btn { display: grid; justify-items: center; gap: 3px; font-size: 9.5px; color: var(--k-text-3); position: relative; }
  .tf-nav-btn .icon { width: 20px; height: 20px; }
  .tf-nav-on { position: absolute; inset: 0; display: grid; justify-items: center; gap: 3px; color: var(--k-accent); opacity: 0; }

  /* The boot: Kawach's own mark, as the app opens. */
  .tf-boot { position: absolute; inset: 0; display: grid; place-items: center; background: #07090f; z-index: 25; }
  .tf-boot img { width: 96px; height: 96px; }

  /* Small adjustments so the app's parts sit right at this size. */
  .tf-view .hero { margin: 0 0 12px; padding: 18px 18px 16px; }
  .tf-view .hero-amount { font-size: 44px; }
  .tf-view .hero-under { display: flex; gap: 22px; margin: 10px 6px 0; }
  .tf-view .summary-owed { flex-wrap: nowrap; gap: 16px; margin-top: 16px; }
  .tf-view .stat { position: relative; border-radius: 12px; padding: 6px 8px; margin: -6px -8px; }
  .tf-glow { position: absolute; inset: 0; border-radius: 12px; box-shadow: 0 0 0 1.5px var(--k-accent), 0 0 22px color-mix(in oklch, var(--k-cyan) 45%, transparent); opacity: 0; pointer-events: none; }
  /* The sum sits where the owed figures will be, and gives way to them. */
  .tf-sum {
    position: absolute;
    left: 14px; right: 14px; top: 262px;
    padding: 8px 14px;
    border-radius: 16px;
    background: var(--k-surface);
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  .tf-sum-row { display: flex; justify-content: space-between; padding: 4px 0; color: var(--k-text-2); }
  .tf-sum-row b { font-weight: 650; color: var(--k-text); }
  .tf-sum-total { border-top: 1px solid var(--k-hairline); margin-top: 4px; padding-top: 8px; color: var(--k-text); font-weight: 650; }
  .tf-sum-total b { color: var(--k-accent); }

  .tf-list { border-radius: 18px; background: var(--k-surface); padding: 2px 12px; }
  .tf-list .k-row { padding: 12px 0; gap: 12px; display: flex; align-items: center; }
  .tf-list .k-row__body { flex: 1; min-width: 0; display: grid; }
  .tf-list .k-row__title { font-size: 14.5px; font-weight: 600; }
  .tf-list .k-row__meta { font-size: 12px; color: var(--k-text-3); }
  .tf-list .k-row__value { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tf-list .tf-bill + .k-row { border-top: 1px solid var(--k-hairline); }
  .tf-bill { border-top: 1px solid var(--k-hairline); padding: 10px 0 12px; font-size: 13px; }
  .tf-bill-line { display: flex; justify-content: space-between; align-items: center; color: var(--k-text-2); position: relative; height: 20px; }
  .tf-bill-line > span { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; }
  .tf-bill-line > b { margin-left: auto; font-weight: 650; color: var(--k-text); font-variant-numeric: tabular-nums; }
  .tf-paid { color: var(--k-positive); }
  .tf-paid .icon { width: 16px; height: 16px; }
  .tf-link { display: inline-block; margin-top: 8px; color: var(--k-accent); font-weight: 600; font-size: 13px; }
  .tf-panel { overflow: hidden; height: 0; }
  .tf-panel-inner { padding: 12px 0 2px; display: grid; gap: 10px; }
  .tf-panel .k-label { font-size: 12px; color: var(--k-text-3); }
  .tf-picker { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--k-surface-elev); font-size: 13.5px; font-weight: 600; }
  .tf-picker .k-brand { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; }
  .tf-sms { padding: 10px 12px; border-radius: 12px; background: var(--k-surface-elev); color: var(--k-text-3); font-size: 12.5px; }
  .tf-panel .k-btn { width: 100%; justify-content: center; }

  .tf-amount { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; min-height: 54px; }
  .tf-caret { display: inline-block; width: 2px; height: 0.9em; margin-left: 3px; vertical-align: -0.08em; background: var(--k-accent); }
  .tf-add-field { margin-top: 12px; display: grid; gap: 6px; }
  .tf-add-field .k-input { font-size: 14px; min-height: 22px; }
  .tf-chips { display: flex; gap: 8px; margin-top: 12px; }
  .tf-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; background: var(--k-surface); font-size: 12.5px; color: var(--k-text-2); }
  .tf-chip .icon { width: 15px; height: 15px; }
  .tf-chip-on { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px var(--k-accent); opacity: 0; }
  .tf-view .k-switch-row { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--k-surface); display: flex; align-items: center; gap: 12px; position: relative; }
  .tf-view .k-switch-row__text { flex: 1; display: grid; font-size: 14px; font-weight: 600; }
  .tf-view .k-switch-row__sub { font-size: 12px; font-weight: 400; color: var(--k-text-3); }
  .tf-save { margin-top: 16px; width: 100%; justify-content: center; }
  .tf-toast {
    position: absolute;
    left: 50%; bottom: 82px;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--k-surface-hero);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    display: inline-flex; gap: 8px; align-items: center;
    opacity: 0;
    z-index: 22;
  }
  .tf-toast .icon { width: 16px; height: 16px; color: var(--k-positive); }

  .tf-day { display: flex; justify-content: space-between; font-size: 12px; color: var(--k-text-3); margin: 4px 4px 8px; }
  .tf-hist { border-radius: 18px; background: var(--k-surface); padding: 0 12px; overflow: hidden; }
  .tf-hist .hist-row { display: flex; align-items: center; gap: 11px; height: 58px; box-sizing: border-box; }
  .tf-hist .cat-chip { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .tf-hist .hist-text { flex: 1; min-width: 0; display: grid; }
  .tf-hist .hist-name { font-size: 14px; font-weight: 600; }
  .tf-hist .hist-sub { font-size: 11.5px; color: var(--k-text-3); display: flex; gap: 6px; align-items: center; }
  .tf-hist .txn-amount { font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tf-new { height: 0; overflow: hidden; }
  .tf-new-row { border-bottom: 1px solid var(--k-hairline); }

  /* A fingertip, so the watcher can see what was pressed. */
  .tf-finger {
    position: absolute;
    left: 0; top: 0;
    width: 38px; height: 38px;
    margin: -19px 0 0 -19px;
    border-radius: 50%;
    background: oklch(100% 0 0 / 0.3);
    box-shadow: 0 0 0 2px oklch(100% 0 0 / 0.75), 0 6px 18px oklch(0% 0 0 / 0.45);
    opacity: 0;
    z-index: 40;
    pointer-events: none;
  }

  /* Play, pause and the scrubber, under the film. */
  .tf-controls {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    box-sizing: border-box;
    background: #000;
  }
  .tf-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--k-surface); color: var(--k-text); cursor: pointer; flex: none; }
  .tf-btn svg { width: 18px; height: 18px; }
  .tf-btn:focus-visible, .tf-scrub:focus-visible { outline: 2px solid var(--k-accent); outline-offset: 2px; }
  .tf-scrub { flex: 1; min-width: 0; accent-color: var(--k-accent); }
  .tf-time { font-size: 13px; color: var(--k-text-2); font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
</style>
</head>
<body class="tf-body">
<div class="tf-frame"><div class="tf-stage" id="stage" role="img" aria-label="A one-minute tour of Kawach, with made-up figures"></div></div>
<div class="tf-controls">
  <button type="button" class="tf-btn" id="tf-play" aria-label="Pause"></button>
  <input type="range" class="tf-scrub" id="tf-scrub" min="0" max="60000" step="100" value="0" aria-label="Position in the tour">
  <span class="tf-time" id="tf-time">0:00 / 1:00</span>
</div>
<script type="module" src="./js/tour-film.js"></script>
</body>
</html>
